<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Log</title>

    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-color: #333333;
            --h1-color: #ff4757;
            --box-bg: #ffffff;
            --box-border: #747d8c;
            --btn-bg: #1e90ff;
            --btn-hover: #1170cd;
            --btn-text: #ffffff;
        }

        .dark {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --h1-color: #ff6b81;
            --box-bg: #2f2f2f;
            --box-border: #57606f;
            --btn-bg: #2f3542;
            --btn-hover: #57606f;
            --btn-text: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Arial Black', Arial, sans-serif;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--box-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.4rem;
            color: var(--h1-color);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            transition: background-color 0.2s;
        }

        .nav-button:hover {
            background-color: var(--btn-hover);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.6rem;
            color: var(--h1-color);
            margin-bottom: 10px;
        }

        .subtitle {
            font-family: Arial, sans-serif;
            margin-bottom: 25px;
        }

        .update-box {
            width: 100%;
            max-width: 700px;
            background-color: var(--box-bg);
            border: 3px solid var(--box-border);
            border-radius: 14px;
            padding: 25px;
            text-align: left;
        }

        .update-box h2 {
            color: var(--h1-color);
            margin-top: 0;
        }

        .update-list {
            font-family: Arial, sans-serif;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .back-button {
            margin-top: 25px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
        }

        .back-button:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🎮 Haaris670's site</div>

        <div class="nav-buttons">
            <button class="nav-button" onclick="toggleTheme()">🌓 Theme</button>
        </div>
    </nav>

    <div class="main-container">

        <h1>📋 Update Log</h1>
        <p class="subtitle">Here you can see the latest updates to my website.</p>

        <div class="update-box">

            <h2>Latest Updates, Follow <a href="https://roblox.com/users/4846160103" class="button">ItsHaaristhebest</a> For more updates</h2>

            <!-- ADD YOUR UPDATE POINTS HERE -->
            <ul class="update-list">
              <li>Added new Country Guesser game</li>
              <li>Updated UI</li>
              <li>Improved programming interpreters in the code Editor</li>
            </ul>

        </div>

        <button class="back-button" onclick="window.location.href='../index.html'">
            ← Back to Website
        </button>

    </div>

    <script>
        const savedTheme = localStorage.getItem('selectedTheme');

        if (savedTheme) {
            document.documentElement.className = savedTheme;
        }

        function toggleTheme() {
            const isDark =
                document.documentElement.classList.toggle('dark');

            localStorage.setItem(
                'selectedTheme',
                isDark ? 'dark' : 'light'
            );
        }
    </script>

</body>
</html>
