    <!-- ================= CSS ================= -->

    <style>

        :root,
        .light {

            --bg-color: #f0f4f8;
            --text-color: #333333;

            --h1-color: #ff4757;
            --h2-color: #747d8c;
            --h3-color: #57606f;

            --nav-bg: #ffffff;

            --btn-bg: #1e90ff;
            --btn-hover: #1170cd;
            --btn-text: #ffffff;

            --box-bg: #ffffff;
            --box-border: #747d8c;

            --card-bg: #ffffff;

            --feedback-correct: #2ed573;
            --feedback-wrong: #ff4757;
        }


        .dark {

            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;

            --h1-color: #ff6b81;
            --h2-color: #a4b0be;
            --h3-color: #ced6e0;

            --nav-bg: #2d2d2d;

            --btn-bg: #2f3542;
            --btn-hover: #57606f;
            --btn-text: #ffffff;

            --box-bg: #2f3542;
            --box-border: #57606f;

            --card-bg: #2f3542;

            --feedback-correct: #2ed573;
            --feedback-wrong: #ff4757;
        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;
            padding: 0;

            background-color: var(--bg-color);
            color: var(--text-color);

            display: flex;
            flex-direction: column;

            min-height: 100vh;

            font-family: 'Arial Black', Arial, sans-serif;

            text-align: center;

            transition:
                background-color 0.3s,
                color 0.3s;
        }


        /* ================= NAVBAR ================= */

        nav {

            display: flex;

            justify-content: space-between;
            align-items: center;

            padding: 12px 20px;

            background-color: var(--nav-bg);

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

            width: 100%;
        }


        .logo {

            font-size: 1.4rem;

            color: var(--h1-color);
        }


        .nav-links {

            display: flex;

            gap: 10px;
        }


        .nav-link-btn {

            background-color: var(--btn-bg);

            color: var(--btn-text);

            border: none;

            padding: 8px 14px;

            border-radius: 6px;

            font-size: 0.95rem;

            cursor: pointer;

            transition:
                background-color 0.2s;
        }


        .nav-link-btn:hover {

            background-color: var(--btn-hover);
        }


        /* ================= MAIN ================= */

        .main-container {

            flex-grow: 1;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 25px 15px;
        }


        h1 {

            font-size: 2.6rem;

            color: var(--h1-color);

            margin: 0 0 8px;
        }


        h2 {

            font-size: 1.6rem;

            color: var(--h2-color);

            margin-bottom: 22px;
        }


        h3 {

            font-size: 1.3rem;

            color: var(--h3-color);

            margin-bottom: 16px;
        }


        /* ================= SCREENS ================= */

        .screen {

            display: none;

            flex-direction: column;

            align-items: center;

            width: 95%;

            max-width: 620px;
        }


        .screen.active {

            display: flex;
        }


        /* ================= BUTTONS ================= */

        .btn-container {

            display: flex;

            flex-direction: column;

            gap: 14px;

            width: 100%;

            max-width: 320px;

            margin: 0 auto;
        }


        button {

            font-size: 1.35rem;

            padding: 14px 22px;

            background-color: var(--btn-bg);

            color: var(--btn-text);

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-family: inherit;

            transition:
                transform 0.1s,
                background-color 0.2s;
        }


        button:hover {

            background-color: var(--btn-hover);

            transform: scale(1.03);
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        .back-btn {

            background-color: #747d8c;

            margin-top: 22px;

            font-size: 1.15rem;

            padding: 10px 20px;
        }


        .back-btn:hover {

            background-color: #57606f;
        }


        /* ================= QUIZZES ================= */

        .quiz-box {

            width: 100%;

            max-width: 480px;

            background: var(--card-bg);

            border: 3px solid var(--box-border);

            border-radius: 14px;

            padding: 28px 20px;

            margin-top: 10px;
        }


        .math-box,
        .country-question {

            font-size: 2.2rem;

            margin-bottom: 18px;

            line-height: 1.3;
        }


        input[type="text"],
        input[type="number"] {

            font-size: 1.6rem;

            padding: 12px;

            text-align: center;

            border: 3px solid var(--box-border);

            background-color: var(--box-bg);

            color: var(--text-color);

            border-radius: 10px;

            font-family: inherit;

            outline: none;

            width: min(320px, 100%);
        }


        #math-message,

            margin-top: 14px;

            font-size: 1.5rem;

            min-height: 36px;

            font-weight: bold;
        }


        /* ================= CHESS ================= */

        .chessboard-wrapper {

            width: min(440px, 100%);

            box-shadow:

            border-radius: 6px;

            overflow: hidden;

            margin-bottom: 14px;

            justify-content: center;

            gap: 8px;

            margin-top: 8px;

            max-width: 440px;

            padding: 8px 14px;

            border-radius: 6px;

            background-color: #57606f;
        }


        .control-btn:hover {

        }

        }


        .danger-btn:hover {

            background-color: #ff2a3b;
        }


        .warn-btn {

            background-color: #ffa502;
        }


        .warn-btn:hover {

        }


        #chess-status {

            font-size: 1.25rem;

            margin-top: 14px;

            font-weight: bold;

            color: var(--h1-color);

            min-height: 30px;
        }


        /* ================= CODE EDITOR ================= */

        textarea {

            width: 100%;

            height: 200px;

            font-family: monospace;

            font-size: 1.1rem;

            text-align: left;

            padding: 12px;

            border: 3px solid var(--box-border);

            background-color: var(--box-bg);

            color: var(--text-color);

            border-radius: 0 10px 10px 0;

            resize: vertical;

            outline: none;

            line-height: 1.25;

            spellcheck: false;
        }


        .output-box {

            background: #ffffff;

            color: #000000;

            border: 3px dashed var(--box-border);

            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border-radius: 10px;

            text-align: left;

            font-family: monospace;

            word-break: break-word;
        }


        .dark .output-box {

            color: #e0e0e0;
        }


        /* ================= LINE NUMBERS ================= */

        #line-numbers {

            display: block;

            width: 45px;

            height: 200px;

            padding: 12px 6px;

            font-family: monospace;

            font-size: 1.1rem;

            line-height: 1.25;

            border: 3px solid var(--box-border);

            border-right: none;

            border-radius: 10px 0 0 10px;

            color: #888;

            text-align: right;

            user-select: none;

        }


        /* ================= EDITOR TOOLBAR ================= */

        .editor-tool-container {

            margin-bottom: 10px;

            gap: 8px;

        .editor-tool-container.active {

            font-size: 1rem;

            padding: 7px 10px;

            text-align: left;

            border: 2px solid var(--box-border);

            background: var(--box-bg);

            color: var(--text-color);

            border-radius: 7px;

            font-family: Arial, sans-serif;

            width: auto;

        .editor-tool-close {

        }


        .editor-tool-close:hover {

            background: #57606f !important;
        }


        /* ================= MOBILE ================= */

                font-size: 0.95rem;

                padding-left: 4px;

                padding-right: 4px;
            }


            textarea {

                font-size: 0.95rem;
            }

        }

    </style>

     JAVASCRIPT

<script>


/* ==================================================
   SCREEN SYSTEM
================================================== */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    const screen =
        document.getElementById(id);


    if (screen) {

        screen.classList.add("active");

    }

}


/* ==================================================
   THEME
================================================== */

function toggleTheme() {

    const isDark =
        document.documentElement.classList.toggle("dark");


    document.documentElement.classList.toggle(
        "light",
        !isDark
    );


    localStorage.setItem(
        "selectedTheme",
        isDark ? "dark" : "light"
    );

}


/* ==================================================
   MATH QUIZ
================================================== */

const mathQuestions = [

    {
        q: "What is 18 ÷ 3?",
        a: 6
    },

    {
        q: "What is 9 × 5?",
        a: 45
    },

    {
        q: "What is 14 + 10?",
        a: 24
    },

    {
        q: "What is 10 × 8?",
        a: 80
    },

    {
        q: "What is √64?",
        a: 8
    },

    {
        q: "What is 7²?",
        a: 49
    },

    {
        q: "What is 100 ÷ 4?",
        a: 25
    },

    {
        q: "What is 132 + 12?",
        a: 144
    },

    {
        q: "What is 3³?",
        a: 27
    },

    {
        q: "What is 5 cubed?",
        a: 125
    }

];


let mathIndex = 0;
let mathScore = 0;


function startMath() {

    mathIndex = 0;
    mathScore = 0;


    document.getElementById(
        "math-score"
    ).textContent = mathScore;


    document.getElementById(
        "math-message"
    ).textContent = "";


    const input =
        document.getElementById(
            "math-input"
        );


    input.style.display =
        "inline-block";


    input.value = "";


    loadMathQuestion();

}


function loadMathQuestion() {

    const question =
        document.getElementById(
            "math-question-text"
        );


    const input =
        document.getElementById(
            "math-input"
        );


    if (
        mathIndex <
        mathQuestions.length
    ) {

        question.textContent =
            `Question ${mathIndex + 1}: ${mathQuestions[mathIndex].q}`;


        input.value = "";


        input.focus();

    } else {

        question.textContent =
            `🎉 Game Over! Final score: ${mathScore}/10`;


        input.style.display =
            "none";

    }

}


function checkMathAnswer() {

    if (
        mathIndex >=
        mathQuestions.length
    ) {

        return;

    }


    const input =
        document.getElementById(
            "math-input"
        );


    const message =
        document.getElementById(
            "math-message"
        );


    const answer =
        Number(input.value);


    const correct =
        mathQuestions[mathIndex].a;


    if (
        input.value !== "" &&
        answer === correct
    ) {

        mathScore++;


        document.getElementById(
            "math-score"
        ).textContent =
            mathScore;


        message.textContent =
            "Correct!";


        message.style.color =
            "var(--feedback-correct)";

    } else {

        message.textContent =
            `Incorrect! Answer was ${correct}`;


        message.style.color =
            "var(--feedback-wrong)";

    }


    mathIndex++;


    setTimeout(() => {

        message.textContent = "";

        loadMathQuestion();

    }, 1400);

}


/* ==================================================
   COUNTRY GUESSER
================================================== */

const countryQuestions = [

    {
        clue: "G..M..Y",
        answer: "Germany"
    },

    {
        clue: "I.D.A",
        answer: "India"
    },

    {
        clue: "P..U",
        answer: "Peru"
    },

    {
        clue: "J.P..",
        answer: "Japan"
    },

    {
        clue: "T..I..A",
        answer: "Tunisia"
    },

    {
        clue: "N..W..Y",
        answer: "Norway"
    },

    {
        clue: "P..K...N",
        answer: "Pakistan"
    },

    {
        clue: "A..T...L..A",
        answer: "Australia"
    },

    {
        clue: "M..I..O",
        answer: "Mexico"
    },

    {
        clue: "F..N.E",
        answer: "France"
    },

    {
        clue: "G..NA",
        answer: "Ghana"
    },

    {
        clue: "L..V.A",
        answer: "Latvia"
    }

];


let countryIndex = 0;
let countryScore = 0;


function startCountries() {

    countryIndex = 0;
    countryScore = 0;


    document.getElementById(
        "country-score"
    ).textContent =
        countryScore;


    document.getElementById(
        "country-message"
    ).textContent = "";


    const input =
        document.getElementById(
            "country-input"
        );


    input.style.display =
        "inline-block";


    input.value = "";


    loadCountryQuestion();

}


function loadCountryQuestion() {

    const question =
        document.getElementById(
            "country-question-text"
        );


    const input =
        document.getElementById(
            "country-input"
        );


    if (
        countryIndex <
        countryQuestions.length
    ) {

        question.textContent =
            `Question ${countryIndex + 1}: Guess: ${countryQuestions[countryIndex].clue}`;


        input.value = "";


        input.focus();

    } else {

        question.textContent =
            `🎉 Game Over! Final score: ${countryScore}/12`;


        input.style.display =
            "none";

    }

}


function checkCountryAnswer() {

    if (
        countryIndex >=
        countryQuestions.length
    ) {

        return;

    }


    const input =
        document.getElementById(
            "country-input"
        );


    const message =
        document.getElementById(
            "country-message"
        );


    const answer =
        countryQuestions[countryIndex].answer;


    const userAnswer =
        input.value.trim();


    if (
        userAnswer.toLowerCase() ===
        answer.toLowerCase()
    ) {

        countryScore++;


        document.getElementById(
            "country-score"
        ).textContent =
            countryScore;


        message.textContent =
            "Correct!";


        message.style.color =
            "var(--feedback-correct)";

    } else {

        message.textContent =
            `Wrong! It was ${answer}`;


        message.style.color =
            "var(--feedback-wrong)";

    }


    countryIndex++;


    setTimeout(() => {

        message.textContent = "";

        loadCountryQuestion();

    }, 1400);

}


/* ==================================================
   CHESS
================================================== */

let board = null;

let game = null;

let moveHistory = [];

let currentHistoryIndex = -1;

let customGameOverState = false;


function initVisualChess() {

    game =
        new Chess();


    moveHistory = [];

    currentHistoryIndex = -1;

    customGameOverState = false;


    document.getElementById(
        "chess-status"
    ).textContent =
        "Your turn (White)";


    const container =
        document.getElementById(
            "board-grid"
        );


    container.innerHTML = "";


    const config = {

        draggable: true,

        position: "start",

        onDragStart:
            onDragStart,

        onDrop:
            onDrop

    };


    board =
        Chessboard2(
            container,
            config
        );

}


function onDragStart(params) {

    if (!game) {

        return false;

    }


    if (
        game.game_over() ||
        customGameOverState ||
        currentHistoryIndex !==
        moveHistory.length - 1
    ) {

        return false;

    }


    if (
        params.piece &&
        params.piece.search(/^b/) !== -1
    ) {

        return false;

    }


    if (
        game.turn() !== "w"
    ) {

        return false;

    }

}


function onDrop(params) {

    if (!game) {

        return "snapback";

    }


    const move =
        game.move({

            from:
                params.source,

            to:
                params.target,

            promotion:
                "q"

        });


    if (move === null) {

        return "snapback";

    }


    moveHistory.push(
        move.san
    );


    currentHistoryIndex =
        moveHistory.length - 1;


    checkGameStatus();


    if (
        !game.game_over() &&
        !customGameOverState
    ) {

        document.getElementById(
            "chess-status"
        ).textContent =
            "Bot is thinking...";


        setTimeout(
            makeBotMove,
            450
        );

    }

}


function makeBotMove() {

    if (
        !game ||
        game.game_over() ||
        customGameOverState
    ) {

        return;

    }


    const possibleMoves =
        game.moves();


    if (
        possibleMoves.length === 0
    ) {

        return;

    }


    let chosen;


    const checks =
        possibleMoves.filter(
            move =>
                move.includes("+") ||
                move.includes("#")
        );


    const captures =
        possibleMoves.filter(
            move =>
                move.includes("x")
        );


    if (
        checks.length > 0
    ) {

        chosen =
            checks[
                Math.floor(
                    Math.random() *
                    checks.length
                )
            ];

    } else if (
        captures.length > 0
    ) {

        chosen =
            captures[
                Math.floor(
                    Math.random() *
                    captures.length
                )
            ];

    } else {

        chosen =
            possibleMoves[
                Math.floor(
                    Math.random() *
                    possibleMoves.length
                )
            ];

    }


    const move =
        game.move(chosen);


    if (!move) {

        return;

    }


    moveHistory.push(
        move.san
    );


    currentHistoryIndex =
        moveHistory.length - 1;


    board.position(
        game.fen(),
        true
    );


    checkGameStatus();

}


function checkGameStatus() {

    if (
        !game ||
        customGameOverState
    ) {

        return;

    }


    if (
        game.in_checkmate()
    ) {

        document.getElementById(
            "chess-status"
        ).textContent =

            game.turn() === "w"
                ? "Checkmate! Bot wins."
                : "Checkmate! You win! 🎉";

        return;

    }


    if (
        game.in_draw() ||
        game.in_stalemate() ||
        game.in_threefold_repetition() ||
        game.insufficient_material()
    ) {

        document.getElementById(
            "chess-status"
        ).textContent =
            "Game Over: Draw";

        return;

    }


    if (
        game.in_check()
    ) {

        document.getElementById(
            "chess-status"
        ).textContent =

            game.turn() === "w"
                ? "Your turn (White) – Check!"
                : "Bot's turn – Check!";

        return;

    }


    document.getElementById(
        "chess-status"
    ).textContent =

        game.turn() === "w"
            ? "Your turn (White)"
            : "Bot's turn (Black)";

}


function handleTakeback() {

    if (
        !game ||
        customGameOverState
    ) {

        return;

    }


    if (
        moveHistory.length >= 2
    ) {

        game.undo();
        game.undo();

        moveHistory.pop();
        moveHistory.pop();

    } else if (
        moveHistory.length === 1
    ) {

        game.undo();

        moveHistory.pop();

    } else {

        return;

    }


    currentHistoryIndex =
        moveHistory.length - 1;


    board.position(
        game.fen(),
        true
    );


    checkGameStatus();

}


function handleResign() {

    if (
        !game ||
        game.game_over() ||
        customGameOverState
    ) {

        return;

    }


    customGameOverState =
        true;


    document.getElementById(
        "chess-status"
    ).textContent =
        "🏳️ You resigned. Bot wins!";

}


function handleDrawOffer() {

    if (
        !game ||
        game.game_over() ||
        customGameOverState
    ) {

        return;

    }


    if (
        Math.random() > 0.45
    ) {

        customGameOverState =
            true;


        document.getElementById(
            "chess-status"
        ).textContent =
            "🤝 Bot accepted the draw. Game Over!";

    } else {

        document.getElementById(
            "chess-status"
        ).textContent =
            "❌ Bot declined the draw. Keep playing!";


        setTimeout(
            checkGameStatus,
            1800
        );

    }

}


function navigateHistory(direction) {

    if (
        moveHistory.length === 0
    ) {

        return;

    }


    const target =
        currentHistoryIndex +
        direction;


    if (
        target >= -1 &&
        target < moveHistory.length
    ) {

        currentHistoryIndex =
            target;


        renderHistoryFrame();

    }

}


function jumpToBound(bound) {

    if (
        moveHistory.length === 0
    ) {

        return;

    }


    currentHistoryIndex =
        bound === "start"
            ? -1
            : moveHistory.length - 1;


    renderHistoryFrame();

}


function renderHistoryFrame() {

    if (
        !board ||
        !game
    ) {

        return;

    }


    const temp =
        new Chess();


    for (
        let i = 0;
        i <= currentHistoryIndex;
        i++
    ) {

        temp.move(
            moveHistory[i]
        );

    }


    board.position(
        temp.fen(),
        true
    );


    if (
        currentHistoryIndex !==
        moveHistory.length - 1
    ) {

        document.getElementById(
            "chess-status"
        ).textContent =
            `Reviewing move ${currentHistoryIndex + 1} / ${moveHistory.length}`;

    } else {

        checkGameStatus();

    }

}

window.addEventListener(
    "keydown",
    function(e) {

        const chessScreen =
            document.getElementById(
                "chess-screen"
            );


        if (
            !chessScreen.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            e.key === "ArrowLeft"
        ) {

            navigateHistory(-1);

        }


        else if (
            e.key === "ArrowRight"
        ) {

            navigateHistory(1);

        }


        else if (
            e.key === "ArrowUp"
        ) {

            e.preventDefault();

            jumpToBound("start");

        }


        else if (
            e.key === "ArrowDown"
        ) {

            e.preventDefault();

            jumpToBound("end");

        }

    }
);


/* ==================================================

================================================== */

let currentLanguage =
    "HTML";


let pyodide =
    null;


let pyodideLoading =
    false;


/* ==================================================
   PYTHON LOADER
================================================== */

async function loadPyodideOnce() {

    if (pyodide) {

        return pyodide;

    }


    if (pyodideLoading) {

        while (
            pyodideLoading
        ) {

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        100
                    )
            );

        }


        return pyodide;

    }


    pyodideLoading =
        true;


    try {

        pyodide =
            await loadPyodide({

                indexURL:
                    "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/"

            });

    }


    catch(error) {

        console.error(
            "Pyodide failed:",
            error
        );


        pyodide =
            null;

    }


    finally {

        pyodideLoading =
            false;

    }


    return pyodide;

}


/* ==================================================
   OUTPUT
================================================== */

function appendOutput(text) {

    const output =
        document.getElementById(
            "editor-output"
        );


    output.textContent +=
        text;


    output.scrollTop =
        output.scrollHeight;

}

    ).textContent =

        );

`<h1>Hello World!</h1>

    }

    ) {

`name = "Haaris"

print("Hello", name)
print("Welcome to Python!")
print(2 + 2)

for number in range(1, 6):

    }

`print("Hello from Lua!")

    }

    );

/* ==================================================
   RUN CODE
================================================== */

async function runCode() {

    const code =
        document.getElementById(
            "editor-input"
        ).value;


    const output =
        document.getElementById(
            "editor-output"
        );


    const runButton =
        document.getElementById(
            "run-btn"
        );


    /* ================= HTML ================= */

    if (
        currentLanguage === "HTML"
    ) {

        output.innerHTML =
            code;

        return;

    }


    /* ================= PYTHON ================= */

    if (
        currentLanguage === "Python"
    ) {

        runButton.disabled =
            true;


        runButton.textContent =
            "⏳ Loading Python...";


        output.textContent =
            "";


        try {

            const py =
                await loadPyodideOnce();


            if (!py) {

                output.textContent =
                    "❌ Python failed to load.";

                return;

            }


            py.setStdout({

                batched:
                    function(text) {

                        appendOutput(
                            text
                        );

                    }

            });


            py.setStderr({

                batched:
                    function(text) {

                        appendOutput(
                            text
                        );

                    }

            });


            runButton.textContent =
                "⏳ Running...";


            await py.runPythonAsync(
                code
            );


            if (
                output.textContent.trim() ===
                ""
            ) {

                output.textContent =
                    "(no output)";

            }

        }


        catch(error) {

            output.textContent =
                "❌ Python Error:\n\n" +
                error.message;

        }


        finally {

            runButton.disabled =
                false;


            runButton.textContent =
                "⚡ RUN CODE";

        }

    }


    /* ================= LUA ================= */

    else if (
        currentLanguage === "Lua"
    ) {

        output.textContent =
            "";


        try {

            const L =
                fengari.lauxlib.luaL_newstate();


            fengari.lualib.luaL_openlibs(
                L
            );


            let luaOutput =
                "";


            fengari.lua.lua_pushcfunction(
                L,
                function(L) {

                    const count =
                        fengari.lua.lua_gettop(
                            L
                        );


                    const parts =
                        [];


                    for (
                        let i = 1;
                        i <= count;
                        i++
                    ) {

                        const value =
                            fengari.lua.lua_tostring(
                                L,
                                i
                            );


                        if (value) {

                            parts.push(
                                fengari.to_jsstring(
                                    value
                                )
                            );

                        } else {

                            parts.push(
                                "nil"
                            );

                        }

                    }


                    luaOutput +=
                        parts.join("\t") +
                        "\n";


                    return 0;

                }
            );


            fengari.lua.lua_setglobal(
                L,
                fengari.to_luastring(
                    "print"
                )
            );


            const status =
                fengari.lauxlib.luaL_dostring(
                    L,
                    fengari.to_luastring(
                        code
                    )
                );


            if (
                status !==
                fengari.lua.LUA_OK
            ) {

                const error =
                    fengari.lua.lua_tostring(
                        L,
                        -1
                    );


                output.textContent =
                    "❌ Lua Error:\n\n" +
                    (
                        error
                            ? fengari.to_jsstring(
                                error
                              )
                            : "Unknown Lua error"
                    );

            }


            else {

                output.textContent =
                    luaOutput ||
                    "(no output)";

            }

        }


        catch(error) {

            output.textContent =
                "❌ Lua Error:\n\n" +
                error.message;

        }

    }

}


/* ==================================================
   EDITOR ELEMENTS
================================================== */

const editorInput =
    document.getElementById(
        "editor-input"
    );


const lineNumbers =
    document.getElementById(
        "line-numbers"
    );


const searchContainer =
    document.getElementById(
        "search-container"
    );


const searchInput =
    document.getElementById(
        "search-input"
    );


const gotoLineContainer =
    document.getElementById(
        "goto-line-container"
    );


const gotoLineInput =
    document.getElementById(
        "goto-line-input"
    );


/* ==================================================
   TAB KEY
================================================== */

if (editorInput) {

    editorInput.addEventListener(
        "keydown",
        function(e) {

            if (
                e.key === "Tab"
            ) {

                e.preventDefault();


                const start =
                    this.selectionStart;


                const end =
                    this.selectionEnd;


                this.value =
                    this.value.substring(
                        0,
                        start
                    ) +
                    "  " +
                    this.value.substring(
                        end
                    );


                this.selectionStart =
                    this.selectionEnd =
                    start + 2;


                updateLineNumbers();

            }

        }
    );


    editorInput.addEventListener(
        "input",
        updateLineNumbers
    );


    editorInput.addEventListener(
        "scroll",
        function() {

            lineNumbers.scrollTop =
                editorInput.scrollTop;

        }
    );

}


/* ==================================================
   LINE NUMBERS
================================================== */

function updateLineNumbers() {

    if (
        !lineNumbers ||
        !editorInput
    ) {

        return;

    }


    const lines =
        editorInput.value.split(
            "\n"
        ).length;


    let numbers =
        [];


    for (
        let i = 1;
        i <= lines;
        i++
    ) {

        numbers.push(i);

    }


    lineNumbers.innerHTML =
        numbers.join("<br>");


    /* Keep line-number height
       matched to editor */

    lineNumbers.style.height =
        editorInput.offsetHeight +
        "px";

}


/* ==================================================
   FIND BAR
================================================== */

function toggleSearch(show) {

    if (!searchContainer) {

        return;

    }


    if (show) {

        /* Close Go To Line */

        toggleGoToLine(false);


        searchContainer.classList.add(
            "active"
        );


        searchInput.focus();

        searchInput.select();

    }


    else {

        searchContainer.classList.remove(
            "active"
        );

    }

}


/* ==================================================
   FIND IN CODE
================================================== */

function findInCode() {

    if (
        !searchInput ||
        !editorInput
    ) {

        return;

    }


    const query =
        searchInput.value;


    if (!query) {

        return;

    }


    const content =
        editorInput.value;


    const start =
        editorInput.selectionEnd || 0;


    const lowerContent =
        content.toLowerCase();


    const lowerQuery =
        query.toLowerCase();


    let index =
        lowerContent.indexOf(
            lowerQuery,
            start
        );


    if (
        index === -1
    ) {

        index =
            lowerContent.indexOf(
                lowerQuery,
                0
            );

    }


    if (
        index !== -1
    ) {

        editorInput.focus();


        editorInput.setSelectionRange(
            index,
            index + query.length
        );

    }


    else {

        alert(
            "Text not found!"
        );

    }

}


/* ==================================================
   FIND ENTER KEY
================================================== */

if (searchInput) {

    searchInput.addEventListener(
        "keydown",
        function(e) {

            if (
                e.key === "Enter"
            ) {

                e.preventDefault();

                findInCode();

            }

        }
    );

}


/* ==================================================
   GO TO LINE
================================================== */

function toggleGoToLine(show) {

    if (
        !gotoLineContainer
    ) {

        return;

    }


    if (show) {

        /* Close Find */

        toggleSearch(false);


        gotoLineContainer.classList.add(
            "active"
        );


        gotoLineInput.focus();


        gotoLineInput.select();

    }


    else {

        gotoLineContainer.classList.remove(
            "active"
        );

    }

}


/* ==================================================
   ACTUALLY GO TO THE LINE
================================================== */

function goToLine() {

    if (
        !editorInput ||
        !gotoLineInput
    ) {

        return;

    }


    const requestedLine =
        parseInt(
            gotoLineInput.value,
            10
        );


    const lines =
        editorInput.value.split(
            "\n"
        );


    const totalLines =
        lines.length;


    /* Invalid number */

    if (
        isNaN(requestedLine)
    ) {

        return;

    }


    /* Keep the number
       inside the editor */

    let line =
        requestedLine;


    if (
        line < 1
    ) {

        line = 1;

    }


    if (
        line > totalLines
    ) {

        line = totalLines;

    }


    /* Calculate character
       position of the line */

    let position =
        0;


    for (
        let i = 0;
        i < line - 1;
        i++
    ) {

        position +=
            lines[i].length +
            1;

    }


    /* Move cursor */

    editorInput.focus();


    editorInput.setSelectionRange(
        position,
        position
    );


    /* Scroll the editor
       so the line is visible */

    const lineHeight =
        parseFloat(
            getComputedStyle(
                editorInput
            ).lineHeight
        );


    editorInput.scrollTop =
        Math.max(
            0,
            (line - 1) *
                lineHeight -
                editorInput.clientHeight / 2
        );


    /* Scroll line numbers too */

    lineNumbers.scrollTop =
        editorInput.scrollTop;


    /* Update the input with
       the actual line reached */

    gotoLineInput.value =
        line;

}


/* ==================================================
   GO TO LINE ENTER KEY
================================================== */

if (gotoLineInput) {

    gotoLineInput.addEventListener(
        "keydown",
        function(e) {

            if (
                e.key === "Enter"
            ) {

                e.preventDefault();

                goToLine();

            }

        }
    );

}


/* ==================================================
   KEYBOARD SHORTCUTS
================================================== */

window.addEventListener(
    "keydown",
    function(e) {

        const editorScreen =
            document.getElementById(
                "editor-screen"
            );


        if (
            !editorScreen.classList.contains(
                "active"
            )
        ) {

            return;

        }


        const activeElement =
            document.activeElement;


        const isTyping =
            activeElement &&
            (
                activeElement.tagName ===
                    "INPUT" ||
                activeElement.tagName ===
                    "TEXTAREA"
            );


        /* ================= L ================= */

        if (
            !isTyping &&
            (
                e.key === "l" ||
                e.key === "L"
            )
        ) {

            e.preventDefault();

            toggleGoToLine(true);

        }


        /* ================= CTRL + F ================= */

        if (
            (e.ctrlKey || e.metaKey) &&
            e.key.toLowerCase() === "f"
        ) {

            e.preventDefault();

            toggleSearch(true);

        }

    }
);

                    }

        /* Start with line numbers
